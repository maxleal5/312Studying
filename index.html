<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CS312 Operating Systems – Interactive Learning Roadmap covering computer architecture, memory hierarchy, virtual memory, page faults, and page replacement algorithms." />
  <title>CS312 OS Learning Roadmap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ═══════════════ HEADER ═══════════════ -->
<header>
  <div class="header-title">
    <div class="logo" aria-hidden="true">💾</div>
    <div>
      <h1>CS312 OS Roadmap</h1>
      <p class="subtitle">Operating Systems — Interactive Learning Path</p>
    </div>
  </div>

  <div class="header-actions">
    <div class="progress-pill" aria-label="Progress">
      <span>0/5 topics</span>
      <div class="progress-bar-mini" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar-fill" style="width:0%"></div>
      </div>
    </div>
    <button class="btn-share" id="share-btn" title="Copy shareable URL">
      🔗 Share Progress
    </button>
    <button class="btn-reset" id="reset-btn" title="Reset all progress">
      ↺ Reset
    </button>
  </div>
</header>

<!-- ═══════════════ MAIN ═══════════════ -->
<main>

  <!-- Overall Progress Banner -->
  <div class="overall-progress">
    <div class="progress-stats">
      <h2>Your Progress — <span id="overall-pct">0%</span></h2>
      <p id="overall-label" style="font-size:.82rem;color:var(--muted)">0 of 5 topics completed</p>
      <div class="progress-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="fill" id="overall-bar" style="width:0%"></div>
      </div>
    </div>
    <div class="progress-badges">
      <div class="badge" id="badge-first">
        <span class="badge-icon">🌱</span>
        <span class="badge-label">Started</span>
      </div>
      <div class="badge" id="badge-half">
        <span class="badge-icon">⚡</span>
        <span class="badge-label">Halfway</span>
      </div>
      <div class="badge" id="badge-all">
        <span class="badge-icon">🏆</span>
        <span class="badge-label">Complete</span>
      </div>
    </div>
  </div>

  <!-- ─── Roadmap ─── -->
  <div class="roadmap" id="roadmap" role="list">
    <!-- Topics injected by app.js -->
  </div>

</main>

<!-- Toast notification -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
